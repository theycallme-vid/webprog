    <script>
        function login(event) {
                // Mencegah halaman refresh (WAJIB)
                event.preventDefault(); 
                
                // Ambil nilai dari ID input yang benar (login_user)
                const username = $("#login_user").val();

                if (username === "") {
                    alert("Username tidak boleh kosong!");
                    return;
                }

                // Simpan data
                localStorage.setItem("loginStatus", "success");
                localStorage.setItem("username", username);

                // Pindah halaman
                console.log("Berhasil login, mengalihkan...");
                window.location.href = "../../portfolio/main.html";
            }
    </script>
